name: CI

on:
  push:
    branches: [main, master, feat/*, fix/*]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test, Package & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Build Core Package
        run: npm run build:core

      - name: Verify Package Dry-Run
        run: npm pack --dry-run ./packages/core

      - name: Run Unit & Property Tests
        run: npm test

      - name: Run Next.js Production Build
        run: npm run build

      - name: Production Dependency Security Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run E2E Workflows & Accessibility Checks
        run: npm run test:e2e

      - name: Run Cross-Browser Workflows (Firefox & WebKit)
        run: npm run test:cross-browser
